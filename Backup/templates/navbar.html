<style>
  .navbar {
    background-color: #007bff;
    color: #fff;
    padding: 10px 0;
  }

  .navbar-container {
    display: flex;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
  }

  .navbar-nav {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
  }

  .nav-item {
    margin-right: 15px;
  }

  .nav-link {
    text-decoration: none;
    color: #fff;
    font-size: 18px;
  }

  .nav-link:hover {
    text-decoration: underline;
  }
</style>

<nav class="navbar">
  <div class="navbar-container">
    <ul class="navbar-nav" style="margin-right: auto">
      <li class="nav-item">
        <a class="nav-link" href="/">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/client_manager">Client Manager</a>
      </li>
    </ul>
    <ul class="navbar-nav">
      <li class="nav-item">
        <span class="nav-link"
          >Current Duration: <span id="timer">Loading...</span>
      </li>
      <li class="nav-item">
        <button class="btn btn-success" onclick="startTimer()">Start</button>
        <button class="btn btn-danger" onclick="stopTimer()">Stop</button>
      </li>
    </ul>
  </div>
</nav>

<script>
  let clientTimer;

  document.addEventListener("DOMContentLoaded", function () {
    checkServerTimerStatus();
  });

  function startTimer() {
    fetch("/start_timer")
      .then((response) => response.json())
      .then((data) => {
        if (data.success) {
          startClientTimer(new Date(data.startTime));
        } else {
          console.error(data.error);
        }
      })
      .catch((error) => console.error("Error:", error));
  }

  function startClientTimer(currentTime) {
    clientTimer = setInterval(function () {
      console.log(currentTime);
      let elapsedTime = currentTime++; // Increment current time each second
      updateTimerDisplay(elapsedTime);
    }, 1000);
  }

  function stopTimer() {
    clearInterval(clientTimer);
    fetch("/stop_timer")
      .then((response) => response.json())
      .then((data) => console.log(data))
      .catch((error) => console.error("Error:", error));
  }

  function checkServerTimerStatus() {
    fetch("/timer_status")
      .then((response) => response.json())
      .then((data) => {
        if (data.running) {
          updateTimerDisplay(data.value);
          startClientTimer(data.value);
        } else {
          updateTimerDisplay("No timer running");
        }
      })
      .catch((error) => console.error("Error:", error));
  }

  function updateTimerDisplay(seconds) {

    if(seconds === "No timer running") {
      document.getElementById("timer").innerText = "No timer running"
    } else {
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const remainingSeconds = seconds % 60;

        const formattedTime = `${hours.toString().padStart(2, "0")}:${minutes
        .toString()
        .padStart(2, "0")}:${remainingSeconds.toString().padStart(2, "0")}`;

        document.getElementById("timer").innerText = formattedTime;
    }
    
  }
</script>
