<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        text-align: center; /* Center align all elements */
      }
      .container {
        width: 300px;
        margin: 100px auto;
        position: relative;
      }

      #client-input {
        width: 100%;
        padding: 10px;
        font-size: 16px;
      }

      #action-button {
        margin-top: 10px;
        padding: 10px;
        width: 100%;
        font-size: 16px;
      }

      .dropdown-content {
        display: none; /* Ensure the dropdown starts as hidden */
        position: absolute;
        top: 40px;
        width: 100%;
        border: 1px solid #ddd;
        max-height: 150px; /* Maximum height to show up to 5 clients */
        overflow-y: auto; /* Make the rest scrollable */
        background-color: white;
        z-index: 1000;
      }

      .dropdown-content div {
        padding: 10px;
        cursor: pointer;
      }

      .dropdown-content div:hover {
        background-color: #f1f1f1;
      }
    </style>
    <title>Time Keeper</title>
  </head>
  <body>
    {% include 'navbar.html' %}
    <div class="container">
      <input type="text" id="client-input" placeholder="Type client name..." />
      <button id="action-button" onclick="handleAction()">Select</button>
      <div id="dropdown" class="dropdown-content"></div>
    </div>
    <script>
      const input = document.getElementById("client-input");
      const button = document.getElementById("action-button");
      const dropdown = document.getElementById("dropdown");
      let clients = [];

      input.addEventListener("input", async () => {
        const query = input.value;
        if (query) {
          const response = await fetch(`/clients?query=${query}`);
          clients = await response.json();
          showDropdown(clients);
          button.textContent = clients.includes(query) ? "Select" : "Create";
        } else {
          hideDropdown();
        }
      });

      input.addEventListener("focus", async () => {
        if (input.value) {
          const response = await fetch(`/clients?query=${input.value}`);
          clients = await response.json();
          showDropdown(clients);
        } else {
          const response = await fetch(`/clients?query=`);
          clients = await response.json();
          showDropdown(clients);
        }
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".container")) {
          hideDropdown();
        }
      });

      function showDropdown(clients) {
        dropdown.innerHTML = "";
        clients.forEach((client) => {
          const div = document.createElement("div");
          div.textContent = client;
          div.addEventListener("click", () => {
            input.value = client;
            hideDropdown();
            button.textContent = "Select";
          });
          dropdown.appendChild(div);
        });
        dropdown.style.display = "block";
      }

      function hideDropdown() {
        dropdown.style.display = "none";
      }

      async function handleAction() {
        const clientName = input.value;
        if (clients.includes(clientName)) {
          alert(`Selected: ${clientName}`);
        } else {
          const response = await fetch("/clients", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: `name=${clientName}`,
          });
          if (response.ok) {
            alert(`Created and selected: ${clientName}`);
            clients.push(clientName);
            button.textContent = "Select";
          }
        }
      }
      // Check if there is a running timer
      fetch("/timer_status")
        .then((response) => response.json())
        .then((data) => {
          if (!data.running) {
            const startTimerButton = document.createElement("button");
            startTimerButton.textContent = "Start Timer";
            startTimerButton.onclick = startTimer;
            document.body.appendChild(startTimerButton);
          }
        })
        .catch((error) => console.error("Error:", error));

      function startTimer() {
        fetch("/start_timer")
          .then((response) => response.json())
          .then((data) => {
            if (data.success) {
              alert("Timer started successfully.");
            } else {
              console.error(data.error);
            }
          })
          .catch((error) => console.error("Error:", error));
      }
    </script>
  </body>
</html>
