{% extends 'base.html' %}

{% block title %}
  Today | Time Keeper
{% endblock %}

{% block content %}
  <div class="tk-page tk-page-narrow">
    <div class="tk-page-header">
      <div>
        <h1 class="tk-title">Today</h1>
        <p class="tk-subtitle" id="today-date"></p>
      </div>
    </div>

    <section class="tk-card overflow-visible">
      <div class="tk-card-header">
        <span class="tk-card-title">Time tracking</span>
        <!-- Tracked time for the running task's client today. When rounding is
             enabled, timekeeper.js also shows the adjusted value and diff. -->
        <span id="client-day-total" class="tabular hidden text-sm font-semibold text-text"></span>
      </div>

      <div class="space-y-5 p-5">
        <!-- Client -->
        <div id="client-field">
          <label class="tk-label" for="autocomplete-input">Client</label>
          <select id="autocomplete-input"></select>
        </div>

        <!-- Budgets in force for the running task's client. Same lifecycle as
             the works list — it's about "the client I'm on right now", so it
             appears and disappears with it. Silent when the client has no
             active budget, which is the common case and shouldn't cost a row
             of empty chrome. -->
        <div id="budget-widget" class="hidden">
          <label class="tk-label">Budget</label>
          <div id="budget-widget-list" class="space-y-2"></div>
        </div>

        <!-- Works (only shown while a task is running). Scoped to the running
             task's client for today, so it persists across separate blocks of
             time spent on the same client. -->
        <div id="works-container" class="hidden">
          <label class="tk-label">Works</label>
          <div id="works-list"></div>
        </div>

        <!-- Time -->
        <div id="timepicker-container" class="rounded-lg border border-border bg-surface-2 px-4 py-5">
          <div class="flex flex-wrap items-center justify-center gap-2.5">
            <div id="task-start-time" class="tabular hidden text-lg font-medium text-muted"></div>

            <button
              type="button"
              id="recent-task-end-time"
              class="hidden rounded-lg border border-border bg-surface px-3 py-1.5 text-left transition-colors hover:border-accent hover:bg-accent-soft"
              title="Click to use this time"
            >
              <div class="text-[0.625rem] font-semibold uppercase tracking-[0.08em] text-faint">Previous end</div>
              <div class="tabular text-sm font-semibold leading-tight text-text" id="recent-task-time-value"></div>
            </button>

            <!-- tk-input-raised, not plain tk-input: this container is
                 bg-surface-2 and so is .tk-input's fill, which made the field
                 invisible against it in both themes. -->
            <input
              type="text"
              id="timepicker"
              class="tk-input tk-input-raised tk-time w-40 py-2 text-center text-2xl font-semibold tracking-[-0.01em]"
            />

            <button type="button" id="current-time-button" class="tk-btn tk-btn-secondary">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v5l3 2" />
              </svg>
              Now
            </button>
          </div>
          <div id="lowestTimeAllowed" class="tabular mt-3 text-center text-xs text-faint"></div>
        </div>
      </div>

      <!-- Actions -->
      <div class="tk-card-footer">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex flex-wrap gap-2">
            <button id="start-button" class="tk-btn tk-btn-primary tk-btn-lg hidden">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="6 4 19 12 6 20 6 4" fill="currentColor" stroke="none" />
              </svg>
              Start task
            </button>

            <button id="complete-button" class="tk-btn tk-btn-primary tk-btn-lg hidden">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6L9 17l-5-5" />
              </svg>
              Complete task
            </button>

            <button id="action-button" class="tk-btn tk-btn-primary tk-btn-lg hidden">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14" />
              </svg>
              Add task
            </button>
          </div>

          <div class="flex flex-wrap gap-2">
            <button id="start-day-button" class="tk-btn tk-btn-primary tk-btn-lg hidden">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="16" rx="2" />
                <path d="M16 3v4M8 3v4M3 11h18" />
              </svg>
              Start day
            </button>

            <button id="end-day-button" class="tk-btn tk-btn-secondary tk-btn-lg hidden">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" />
              </svg>
              End day
            </button>

            <button id="reopen-day-button" class="tk-btn tk-btn-warn tk-btn-lg hidden">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 109-9 9 9 0 00-6.36 2.64L3 8" />
                <path d="M3 3v5h5" />
              </svg>
              Re-open day
            </button>
          </div>
        </div>
      </div>
    </section>
  </div>
{% endblock %}

{% block page_scripts %}
  <script type="module">
    import { TimeKeeperIndex } from "{{ url_for('static', filename='js/timekeeper.js') }}"
    import { ready } from "{{ url_for('static', filename='js/base.js') }}"

    ready(async () => {
      document.getElementById('today-date').textContent = new Date().toLocaleDateString(undefined, {
        weekday: 'long',
        month: 'long',
        day: 'numeric',
      })

      const timekeeper = new TimeKeeperIndex()
      try {
        await timekeeper.init()
      } catch (error) {
        // init() awaits several requests; one rejecting used to abort the whole
        // chain and leave the dashboard with every control hidden.
        console.error('Dashboard init failed, retrying:', error)
        setTimeout(() => timekeeper.init().catch((e) => console.error(e)), 3000)
      }
    })
  </script>
{% endblock %}
