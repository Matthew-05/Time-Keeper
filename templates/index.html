{% extends 'base.html' %}

{% block content %}
  <div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50 pt-24 pb-12">
    <div class="max-w-4xl mx-auto px-4">
      <!-- Main Card -->
      <div class="bg-white rounded-3xl shadow-xl border border-gray-100 backdrop-blur-lg backdrop-filter">
        <!-- Header -->
        <div class="px-8 py-6 bg-gradient-to-r from-blue-600 to-indigo-600">
          <h1 class="text-2xl font-bold text-white flex items-center">
            <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>Time Tracking Dashboard
          </h1>
        </div>

        <!-- Main Content -->
        <div class="p-8 space-y-8">
          <!-- Client Selection -->
          <div class="space-y-3 z-50">
            <label class="text-sm font-semibold text-gray-700 uppercase tracking-wider">Client</label>
            <select id="autocomplete-input" class="w-full px-4 py-3 bg-white border-2 border-blue-100 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all shadow-md hover:border-blue-200">
              <option value="">Select a client</option>
            </select>
          </div>

          <!-- Task Details Grid -->
          <div class="grid grid-cols-2 gap-6">
            <div id="type-input-container" class="hidden space-y-3">
              <label class="text-sm font-semibold text-gray-700 uppercase tracking-wider">Task Type</label>
              <input type="text" id="type-input" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 transition-all" />
            </div>

            <div id="description-input-container" class="hidden space-y-3">
              <label class="text-sm font-semibold text-gray-700 uppercase tracking-wider">Description</label>
              <input type="text" id="description-input" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 transition-all" />
            </div>
          </div>

          <!-- Time Selection -->
          <div class="text-center py-6" id="timepicker-container">
            <div class="flex items-center justify-center space-x-3">
              <input type="text" id="timepicker" class="text-4xl font-bold text-center bg-gray-50 px-8 py-4 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-blue-500 transition-all" />
              <button id="current-time-button" class="px-4 py-3 bg-gray-200 text-gray-800 rounded-xl hover:bg-gray-300 transition-all font-medium">
                <span class="flex items-center">
                  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>Now
                </span>
              </button>
            </div>
            <div id="lowestTimeAllowed" class="text-sm text-gray-500 mt-3 font-medium"></div>
          </div>

        <!-- Action Buttons -->
        <div class="px-8 py-6 bg-gray-50 border-t border-gray-100">
          <div class="flex justify-between items-center">
            <!-- Task Controls -->
            <div class="space-x-4">
              <button id="action-button" class="hidden px-6 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition-all transform hover:scale-105 font-medium">Add Task</button>
              <button id="complete-button" class="hidden px-6 py-3 bg-green-600 text-white rounded-xl hover:bg-green-700 transition-all transform hover:scale-105 font-medium">Complete Task</button>
              <button id="start-button" class="hidden px-6 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition-all transform hover:scale-105 font-medium">
                <span class="flex items-center">
                  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                  </svg>Start Task
                </span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Day Control Buttons -->
      <div class="mt-8 flex justify-center space-x-6">
        <button id="start-day-button" class="hidden px-8 py-3 bg-green-600 text-white rounded-xl hover:bg-green-700 transition-all transform hover:scale-105 font-medium shadow-lg">Start Day</button>
        <button id="end-day-button" class="hidden px-8 py-3 bg-red-500 text-white rounded-xl hover:bg-red-600 transition-all transform hover:scale-105 font-medium shadow-lg">End Day</button>
        <button id="reopen-day-button" class="hidden px-8 py-3 bg-amber-500 text-white rounded-xl hover:bg-amber-600 transition-all transform hover:scale-105 font-medium shadow-lg">Re-open Day</button>
      </div>
    </div>
  </div>
{% endblock %}

{% block page_scripts %}
  <script type="module">
    import { TimeKeeperIndex } from "{{ url_for('static', filename='js/timekeeper.js') }}"
    document.addEventListener('DOMContentLoaded', async () => {
      const timekeeper = new TimeKeeperIndex()
      await timekeeper.init()
    })
  </script>
{% endblock %}
