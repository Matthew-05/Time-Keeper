{% extends 'base.html' %}

{% block content %}
  <div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50 pt-24 pb-12">
    <div class="max-w-4xl mx-auto px-4">
      <!-- Main Card -->
      <div class="bg-white rounded-3xl shadow-xl border border-gray-100 backdrop-blur-lg backdrop-filter overflow-hidden">
        <!-- Header -->
        <div class="px-8 py-6 bg-gradient-to-r from-blue-600 to-indigo-600">
          <h1 class="text-2xl font-bold text-white flex items-center">
            <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>Time Tracking Dashboard
          </h1>
        </div>

        <!-- Main Content -->
        <div class="p-8 space-y-8">
          <!-- Client Selection -->
          <div class="space-y-3 z-50">
            <label class="text-sm font-semibold text-gray-700 uppercase tracking-wider">Client</label>
            <select id="autocomplete-input" class="w-full px-4 py-3 bg-white border-2 border-blue-100 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all shadow-sm hover:border-blue-200">
              <option value="">Select a client</option>
            </select>
          </div>

          <!-- Task Details Grid -->
          <div id="description-input-container" class="hidden space-y-3">
            <label class="text-sm font-semibold text-gray-700 uppercase tracking-wider">Description</label>
            <input type="text" id="description-input" class="w-full px-4 py-3 bg-gray-50 border-2 border-blue-100 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all shadow-sm hover:border-blue-200" />
          </div>

          <!-- Time Selection -->
          <div class="text-center py-6" id="timepicker-container">
            <div class="flex items-center justify-center space-x-3">
              <div id="task-start-time" class="text-xl font-medium text-gray-700 hidden"></div>
              <input type="text" id="timepicker" class="text-2xl font-semibold text-center bg-gray-50 px-3 py-2 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-blue-500 transition-all w-36" />
              <button id="current-time-button" class="px-4 py-3 bg-gray-100 text-gray-800 rounded-xl hover:bg-gray-200 transition-all font-medium shadow-sm flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>Now
              </button>
            </div>
            <div id="lowestTimeAllowed" class="text-sm text-gray-500 mt-3 font-medium"></div>
          </div>

        <!-- Action Buttons -->
        <div class="px-8 py-6 bg-gray-50 border-t border-gray-100">
          <div class="flex flex-wrap justify-between items-center gap-4">
            <!-- Task Controls -->
            <div class="flex flex-wrap gap-4">
              <!-- Start Task Button -->
              <button id="start-button" class="hidden action-btn group relative px-6 py-3 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-xl hover:from-blue-600 hover:to-blue-700 transition-all duration-300 font-medium shadow-md flex items-center overflow-hidden">
                <span class="absolute inset-0 w-full h-full bg-gradient-to-r from-blue-600 to-blue-700 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
                <span class="relative flex items-center">
                  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                  </svg>
                  Start Task
                </span>
              </button>
              
              <!-- Complete Task Button -->
              <button id="complete-button" class="hidden action-btn group relative px-6 py-3 bg-gradient-to-r from-green-500 to-green-600 text-white rounded-xl hover:from-green-600 hover:to-green-700 transition-all duration-300 font-medium shadow-md flex items-center overflow-hidden">
                <span class="absolute inset-0 w-full h-full bg-gradient-to-r from-green-600 to-green-700 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
                <span class="relative flex items-center">
                  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                  </svg>
                  Complete Task
                </span>
              </button>
              
              <!-- Add Task Button -->
              <button id="action-button" class="hidden action-btn group relative px-6 py-3 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-xl hover:from-blue-600 hover:to-blue-700 transition-all duration-300 font-medium shadow-md flex items-center overflow-hidden">
                <span class="absolute inset-0 w-full h-full bg-gradient-to-r from-blue-600 to-blue-700 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
                <span class="relative flex items-center">
                  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                  </svg>
                  Add Task
                </span>
              </button>
            </div>
            
            <!-- Day Controls -->
            <div class="flex flex-wrap gap-4">
              <!-- Start Day Button -->
              <button id="start-day-button" class="hidden action-btn group relative px-6 py-3 bg-gradient-to-r from-green-500 to-green-600 text-white rounded-xl hover:from-green-600 hover:to-green-700 transition-all duration-300 font-medium shadow-md flex items-center overflow-hidden">
                <span class="absolute inset-0 w-full h-full bg-gradient-to-r from-green-600 to-green-700 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
                <span class="relative flex items-center">
                  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                  </svg>
                  Start Day
                </span>
              </button>
              
              <!-- End Day Button -->
              <button id="end-day-button" class="hidden action-btn group relative px-6 py-3 bg-gradient-to-r from-red-500 to-red-600 text-white rounded-xl hover:from-red-600 hover:to-red-700 transition-all duration-300 font-medium shadow-md flex items-center overflow-hidden">
                <span class="absolute inset-0 w-full h-full bg-gradient-to-r from-red-600 to-red-700 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
                <span class="relative flex items-center">
                  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                  </svg>
                  End Day
                </span>
              </button>
              
              <!-- Reopen Day Button -->
              <button id="reopen-day-button" class="hidden action-btn group relative px-6 py-3 bg-gradient-to-r from-amber-500 to-amber-600 text-white rounded-xl hover:from-amber-600 hover:to-amber-700 transition-all duration-300 font-medium shadow-md flex items-center overflow-hidden">
                <span class="absolute inset-0 w-full h-full bg-gradient-to-r from-amber-600 to-amber-700 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
                <span class="relative flex items-center">
                  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                  </svg>
                  Re-open Day
                </span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

{% block page_scripts %}
  <script type="module">
    import { TimeKeeperIndex } from "{{ url_for('static', filename='js/timekeeper.js') }}"
    document.addEventListener('DOMContentLoaded', async () => {
      const timekeeper = new TimeKeeperIndex()
      await timekeeper.init()
    })
  </script>
{% endblock %}
