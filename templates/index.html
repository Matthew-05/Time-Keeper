{% extends 'base.html' %}

{% block content %}
  <div class="max-w-4xl mx-auto mt-8">
    <div class="mb-8">
      <h4 class="text-2xl font-bold text-gray-800">Time Manager</h4>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
      <div class="max-w-md mx-auto space-y-4">
        <div class="relative">
          <select id="autocomplete-input" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <option value="">Select a client</option>
          </select>
        </div>

        <div class="relative hidden" id="type-input-container">
          <input type="text" id="type-input" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500" placeholder="Type (i.e. audit, review, etc.)" />
        </div>

        <div class="relative hidden" id="description-input-container">
          <input type="text" id="description-input" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500" placeholder="Description" />
        </div>

        <div class="text-center" id="timepicker-container">
          <input type="text" class="text-2xl text-center cursor-pointer px-4 py-2 border rounded-md" id="timepicker" />
          <div id="lowestTimeAllowed" class="text-sm text-gray-600 mt-1"></div>
        </div>

        <div class="flex justify-center gap-4">
          <button id="action-button" class="hidden px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600">Add Task</button>
          <button id="complete-button" class="hidden px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600">Complete Task</button>
          <button id="start-button" class="hidden px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 flex items-center">
            <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
            </svg>Start Task
          </button>
        </div>

        <div class="flex justify-between mt-6">
          <button id="start-break-button" class="hidden px-4 py-2 bg-yellow-500 text-white rounded-md hover:bg-yellow-600">Start Break</button>
          <button id="end-day-button" class="hidden px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600">End Day</button>
        </div>
      </div>
    </div>

    <div class="mt-8 text-center">
      <button id="end-break-button" class="hidden px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600">End Break</button>
      <button id="start-day-button" class="hidden px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600">Start Day</button>
      <button id="reopen-day-button" class="hidden px-4 py-2 bg-yellow-500 text-white rounded-md hover:bg-yellow-600">Re-open Day</button>
    </div>
  </div>
{% endblock %}

{% block page_scripts %}
  <script type="module">
    import { TimeKeeperIndex } from "{{ url_for('static', filename='js/timekeeper.js') }}"
    document.addEventListener('DOMContentLoaded', async () => {
      const timekeeper = new TimeKeeperIndex()
      await timekeeper.init()
    })
  </script>
{% endblock %}
