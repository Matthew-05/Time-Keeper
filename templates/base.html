<!DOCTYPE html>
<!--
  The theme comes from settings.json, server-side, so `.dark` is already on the
  element the parser sees — there is no window in which a dark-mode user could
  be shown a light page. `auto` is the one case the server can't resolve (it
  doesn't know the OS preference), and the inline script below handles it.
-->
<html
  lang="en"
  class="h-full{% if settings.theme == 'dark' %} dark{% endif %}"
  data-theme-mode="{{ settings.theme }}"
  data-time-format="{{ settings.time_format }}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Time Keeper
      {% endblock %}
    </title>

    <!--
      Only `auto` is left to resolve, and only the browser can resolve it.
      Deliberately inline and blocking — it must run before the stylesheet
      paints the body background, or dark-mode users get a white flash.
    -->
    <script>
      ;(function () {
        if (document.documentElement.dataset.themeMode !== 'auto') return
        try {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          /* matchMedia unavailable — fall back to light. */
        }
      })()
    </script>

    <!-- All assets are vendored under static/vendor so the packaged app works offline. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/flatpickr/flatpickr.min.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/choices/choices.min.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />

    {% block additional_styles %}

    {% endblock %}
  </head>

  <body class="min-h-full">
    {% include 'navbar.html' %}

    <main>
      {% block content %}

      {% endblock %}
    </main>

    <div id="version-display" class="tabular fixed bottom-2 right-3 text-[0.6875rem] text-faint select-none">v{{ app_version }}</div>

    <script src="{{ url_for('static', filename='vendor/flatpickr/flatpickr.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/choices/choices.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/base.js') }}" type="module"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}" type="module"></script>

    {% block page_scripts %}

    {% endblock %}
  </body>
</html>
