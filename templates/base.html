<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Time Keeper
      {% endblock %}
    </title>

    <!--
      Applied before first paint so a dark-mode user never sees a white flash.
      Deliberately inline and blocking — it must run before the stylesheet
      paints the body background.
    -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('tk-theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* localStorage unavailable — fall back to light. */
        }
      })()
    </script>

    <!-- All assets are vendored under static/vendor so the packaged app works offline. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/flatpickr/flatpickr.min.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/choices/choices.min.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />

    {% block additional_styles %}

    {% endblock %}
  </head>

  <body class="min-h-full">
    {% include 'navbar.html' %}

    <main>
      {% block content %}

      {% endblock %}
    </main>

    <div id="version-display" class="tabular fixed bottom-2 right-3 text-[0.6875rem] text-faint select-none">v{{ app_version }}</div>

    <script src="{{ url_for('static', filename='vendor/flatpickr/flatpickr.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/choices/choices.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/base.js') }}" type="module"></script>

    {% block page_scripts %}

    {% endblock %}
  </body>
</html>
