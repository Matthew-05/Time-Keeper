<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Items</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/vanilla-datatables@1.6.2/dist/vanilla-dataTables.min.css"
    />
  </head>
  <body>
    <table id="taskTable" class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Date</th>
          <th>Start Time</th>
          <th>End Time</th>
          <th>Client</th>
          <th>Type</th>
          <th>Description</th>
          <th>Time Spent</th>
          <th>Adjust Entry</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/vanilla-datatables@1.6.2/dist/vanilla-dataTables.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        fetch("/tasks")
          .then((response) => response.json())
          .then((data) => {
            const table = new DataTable("#taskTable", {
              data: data,
              perPage: 10,
              columns: [
                { name: "ID" },
                { name: "Date" },
                { name: "Start Time" },
                { name: "End Time" },
                { name: "Client" },
                { name: "Type" },
                { name: "Description" },
                { name: "Time Spent" },
                { name: "Adjust Entry" },
              ],
            });
          })
          .catch((error) => console.error("Error fetching tasks:", error));
      });
    </script>
  </body>
</html>
