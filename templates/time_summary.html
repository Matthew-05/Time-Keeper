{% extends 'base.html' %}

{% block title %}
  Summary | Time Keeper
{% endblock %}

{% block content %}
  <div class="tk-page max-w-5xl">
    <div class="tk-page-header">
      <div>
        <h1 class="tk-title">Time summary</h1>
        <p class="tk-subtitle">Billable hours across a date range.</p>
      </div>

      <div class="relative">
        <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-faint" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="2" />
          <path d="M16 3v4M8 3v4M3 11h18" />
        </svg>
        <input type="text" id="date-range" class="tk-input tabular w-64 cursor-pointer pl-9 text-sm" placeholder="Select date range…" readonly />
      </div>
    </div>

    <div class="mb-4">
      <div class="tk-segmented">
        <button class="tk-segment active" data-tab="client">By client</button>
        <button class="tk-segment" data-tab="daily">By day</button>
      </div>
    </div>

    <section class="tk-card p-4">
      <div class="tab-content" id="client-tab">
        <div class="h-[60vh] min-h-[320px]">
          <canvas id="timeChart"></canvas>
        </div>
      </div>

      <div class="tab-content hidden" id="daily-tab">
        <div class="h-[60vh] min-h-[320px]">
          <canvas id="dailyTimeChart"></canvas>
        </div>
      </div>
    </section>
  </div>
{% endblock %}

{% block page_scripts %}
  <script src="{{ url_for('static', filename='vendor/chartjs/chart.umd.min.js') }}"></script>
  <script>
    let clientColorMap = {}
    let chart
    let dailyChart

    /** Pull live theme tokens so charts repaint correctly on theme switch. */
    function tokens() {
      const css = getComputedStyle(document.documentElement)
      const v = (name) => css.getPropertyValue(name).trim()
      return {
        text: v('--text'),
        muted: v('--muted'),
        faint: v('--faint'),
        border: v('--border'),
        accent: v('--accent'),
        danger: v('--danger'),
      }
    }

    function baseChartOptions(title) {
      const t = tokens()
      return {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          title: { display: true, text: title, color: t.text, font: { size: 14, weight: '600' } },
          legend: { labels: { color: t.muted, boxWidth: 12, boxHeight: 12, usePointStyle: true } },
        },
        scales: {
          x: {
            ticks: { color: t.faint },
            grid: { color: t.border, drawBorder: false },
          },
          y: {
            beginAtZero: true,
            title: { display: true, text: 'Hours', color: t.muted },
            ticks: { color: t.faint },
            grid: { color: t.border, drawBorder: false },
          },
        },
      }
    }

    function getClientColor(clientName) {
      if (!clientColorMap[clientName]) {
        clientColorMap[clientName] = `hsl(${(Object.keys(clientColorMap).length * 137.5) % 360}, 62%, 58%)`
      }
      return clientColorMap[clientName]
    }

    async function updateChart() {
      const dateRange = document.getElementById('date-range').value
      const [startDate, endDate] = dateRange.split(' to ')
      if (!startDate || !endDate) return
      const response = await fetch(`/api/summary/custom/${startDate}/${endDate}`)
      createBarChart('timeChart', 'Time by client', await response.json())
    }

    async function updateDailyChart() {
      const dateRange = document.getElementById('date-range').value
      const [startDate, endDate] = dateRange.split(' to ')
      if (!startDate || !endDate) return
      const response = await fetch(`/api/summary/daily/${startDate}/${endDate}`)
      createDailyChart('dailyTimeChart', 'Daily billable hours', await response.json())
    }

    function createBarChart(canvasId, title, data) {
      if (chart) chart.destroy()

      data.sort((a, b) => b.total_time - a.total_time)
      const totalHours = (data.reduce((sum, item) => sum + item.total_time, 0) / 3600).toFixed(2)

      const options = baseChartOptions(`${title} — ${totalHours} hrs total`)
      options.plugins.legend.display = false

      chart = new Chart(document.getElementById(canvasId).getContext('2d'), {
        type: 'bar',
        data: {
          labels: data.map((item) => item.client_name),
          datasets: [
            {
              label: 'Hours',
              data: data.map((item) => item.total_time / 3600),
              backgroundColor: data.map((item) => getClientColor(item.client_name)),
              borderRadius: 4,
              borderSkipped: false,
            },
          ],
        },
        options,
      })
    }

    function createDailyChart(canvasId, title, data) {
      if (dailyChart) dailyChart.destroy()

      const t = tokens()
      const hours = data.map((item) => item.total_hours)

      // 5-day centred moving average
      const movingAverage = hours.map((value, index, array) => {
        const window = array.slice(Math.max(0, index - 2), Math.min(array.length, index + 3))
        return window.reduce((a, b) => a + b, 0) / window.length
      })

      dailyChart = new Chart(document.getElementById(canvasId).getContext('2d'), {
        type: 'line',
        data: {
          labels: data.map((item) => item.date),
          datasets: [
            {
              label: 'Total hours',
              data: hours,
              borderColor: t.accent,
              backgroundColor: t.accent,
              pointRadius: 2,
              tension: 0.25,
              fill: false,
            },
            {
              label: '5-day average',
              data: movingAverage,
              borderColor: t.danger,
              borderDash: [5, 5],
              pointRadius: 0,
              tension: 0.25,
              fill: false,
            },
          ],
        },
        options: baseChartOptions(title),
      })
    }

    function refreshCharts() {
      updateChart()
      updateDailyChart()
    }

    document.addEventListener('DOMContentLoaded', () => {
      flatpickr('#date-range', {
        mode: 'range',
        dateFormat: 'Y-m-d',
        onChange: (selectedDates) => {
          if (selectedDates.length === 2) refreshCharts()
        },
      })

      document.querySelectorAll('.tk-segment').forEach((button) => {
        button.addEventListener('click', () => {
          document.querySelectorAll('.tk-segment').forEach((b) => b.classList.remove('active'))
          document.querySelectorAll('.tab-content').forEach((c) => c.classList.add('hidden'))

          button.classList.add('active')
          document.getElementById(`${button.dataset.tab}-tab`).classList.remove('hidden')
        })
      })

      // Default range: Monday–Friday of the current week.
      const today = new Date()
      const monday = new Date(today)
      monday.setDate(today.getDate() - today.getDay() + 1)
      const friday = new Date(today)
      friday.setDate(today.getDate() - today.getDay() + 5)

      document.getElementById('date-range')._flatpickr.setDate([monday, friday])
      refreshCharts()
    })

    // Charts bake their colours in at construction time, so rebuild on theme change.
    document.addEventListener('themeChanged', refreshCharts)
  </script>
{% endblock %}
