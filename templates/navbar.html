<script>
  /* ---------------------------------------------------------------------
     Running-task timer
     Theme handling lives in static/js/theme.js — the preference is stored in
     settings.json and applied server-side, so there's nothing to do here.
     --------------------------------------------------------------------- */

  // Store task start time as an absolute timestamp
  let taskStartTimestamp = null
  let timerUpdateInterval = null

  document.addEventListener('DOMContentLoaded', function () {
    ;(function setActiveNavLink() {
      const path = window.location.pathname.replace(/\/$/, '') || '/'
      document.querySelectorAll('.tk-nav-link[data-nav-page]').forEach(function (a) {
        const href = a.getAttribute('href').replace(/\/$/, '') || '/'
        if (path === href || (href !== '/' && path.indexOf(href) === 0)) {
          a.classList.add('tk-nav-link-active')
        } else {
          a.classList.remove('tk-nav-link-active')
        }
      })
    })()
    checkForUnfinishedTask()

    // Add event listener for custom event when a task is completed
    document.addEventListener('taskCompleted', function () {
      stopAndResetTimer()
    })
  })

  document.addEventListener('taskStarted', function (event) {
    if (event.detail && event.detail.startTime) {
      startTimerWithTime(event.detail.startTime)
    } else {
      checkForUnfinishedTask()
    }
  })

  function startTimerWithTime(timeString) {
    // Handle different time formats
    let taskStartTime

    // Check if the time is in HH:MM:SS format
    if (/^\d{1,2}:\d{2}:\d{2}$/.test(timeString)) {
      taskStartTime = secondsSinceMidnight(timeString)
    }
    // Check if the time is in HH:MM format
    else if (/^\d{1,2}:\d{2}$/.test(timeString)) {
      taskStartTime = secondsSinceMidnight(timeString + ':00')
    }
    // Check if the time is in 12-hour format (e.g., "3:30 PM")
    else if (/^\d{1,2}:\d{2}\s*[AP]M$/i.test(timeString)) {
      // Convert to 24-hour format
      const match = timeString.match(/(\d+):(\d+)\s*([AP]M)/i)
      if (match) {
        let [_, hours, minutes, ampm] = match
        hours = parseInt(hours)

        // Convert to 24-hour format
        if (ampm.toUpperCase() === 'PM' && hours < 12) {
          hours += 12
        } else if (ampm.toUpperCase() === 'AM' && hours === 12) {
          hours = 0
        }

        // Format as HH:MM:00
        const formattedTime = `${hours.toString().padStart(2, '0')}:${minutes}:00`
        taskStartTime = secondsSinceMidnight(formattedTime)
      }
    } else {
      console.error('Unrecognized time format:', timeString)
      // Fall back to checking for unfinished tasks
      checkForUnfinishedTask()
      return
    }

    const now = new Date()
    const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate())
    const currentSeconds = (now - startOfDay) / 1000

    // Calculate when the task actually started in absolute time
    const taskStartedSecondsAgo = currentSeconds - taskStartTime

    // Store the absolute timestamp when the task started
    taskStartTimestamp = Date.now() - taskStartedSecondsAgo * 1000

    startTimer()
  }

  function startTimer() {
    // Clear any existing interval
    stopTimer()

    // Update immediately
    updateTimerDisplay()

    // Set up interval to update every second
    timerUpdateInterval = setInterval(updateTimerDisplay, 1000)
  }

  // Handle page visibility changes to keep timer accurate when window regains focus
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && taskStartTimestamp !== null) {
      // Page became visible again - immediately update the timer display
      // This ensures the timer shows the correct time even if it was throttled while hidden
      updateTimerDisplay()
    }
  })

  // Also handle when window regains focus (additional safeguard)
  window.addEventListener('focus', function () {
    if (taskStartTimestamp !== null) {
      // Window regained focus - immediately update the timer display
      updateTimerDisplay()
    }
  })

  function stopTimer() {
    if (timerUpdateInterval) {
      clearInterval(timerUpdateInterval)
      timerUpdateInterval = null
    }
  }

  function stopAndResetTimer() {
    stopTimer()
    taskStartTimestamp = null
    updateTimerDisplay('No timer running')
  }

  function secondsSinceMidnight(timeString) {
    const [hours, minutes, seconds] = timeString.split(':').map(Number)
    return hours * 3600 + minutes * 60 + seconds
  }

  let unfinishedRetryTimer = null

  async function checkForUnfinishedTask() {
    // This runs on every page. Unguarded it was the most visible instance of
    // the hang: one failed request and the pill reads "Loading…" forever.
    // The server is local, so just keep asking until it answers.
    clearTimeout(unfinishedRetryTimer)

    const controller = new AbortController()
    const timeout = setTimeout(() => controller.abort(), 10000)

    try {
      const response = await fetch('/unfinished_tasks', { signal: controller.signal })
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`)
      const tasks = await response.json()

      if (tasks.length > 0) {
        startTimerWithTime(tasks[0].start_time)
      } else {
        updateTimerDisplay('No timer running')
      }
    } catch (error) {
      console.error('Could not check for a running task, retrying:', error)
      const timerEl = document.getElementById('timer')
      if (timerEl) timerEl.innerText = 'Reconnecting…'
      setTimerRunning(false)
      unfinishedRetryTimer = setTimeout(checkForUnfinishedTask, 2000)
    } finally {
      clearTimeout(timeout)
    }
  }

  /** Swap the pill between its idle and running appearance. */
  function setTimerRunning(running) {
    const pill = document.getElementById('timer-pill')
    const dot = document.getElementById('timer-dot')
    if (!pill || !dot) return
    pill.classList.toggle('tk-badge-accent', running)
    pill.classList.toggle('tk-badge-neutral', !running)
    dot.classList.toggle('tk-dot-pulse', running)
  }

  function updateTimerDisplay(status) {
    const timerEl = document.getElementById('timer')
    if (!timerEl) return

    if (status === 'No timer running' || taskStartTimestamp === null) {
      timerEl.innerText = 'No task running'
      setTimerRunning(false)
      return
    }

    // Calculate elapsed time based on the absolute start timestamp
    const elapsedMilliseconds = Date.now() - taskStartTimestamp
    const elapsedSeconds = Math.floor(elapsedMilliseconds / 1000)

    const hours = Math.floor(elapsedSeconds / 3600)
    const minutes = Math.floor((elapsedSeconds % 3600) / 60)
    const remainingSeconds = elapsedSeconds % 60

    timerEl.innerText = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`
    setTimerRunning(true)
  }

  // Make the function available globally so it can be called from other scripts
  window.stopAndResetTimer = stopAndResetTimer
</script>
