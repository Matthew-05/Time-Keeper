<nav class="bg-white border-b border-gray-200 fixed w-full z-30 top-0">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      <div class="flex items-center space-x-8">
        <a href="/" class="text-xl font-bold text-blue-600">TimeKeeper</a>
        <div class="hidden md:flex space-x-6">
          <a href="/" class="nav-link px-3 py-2 text-sm font-medium text-gray-900 hover:text-blue-600 transition-colors">Home</a>
          <a href="/task_browser" class="nav-link px-3 py-2 text-sm font-medium text-gray-500 hover:text-blue-600 transition-colors">Tasks</a>
          <a href="/summary" class="nav-link px-3 py-2 text-sm font-medium text-gray-500 hover:text-blue-600 transition-colors">Summary</a>
          <a href="/client_manager" class="nav-link px-3 py-2 text-sm font-medium text-gray-500 hover:text-blue-600 transition-colors">Clients</a>
        </div>
      </div>
      <div class="flex items-center space-x-6">
        <div class="flex items-center space-x-2 text-sm text-gray-500">
          <span class="hidden sm:inline">Last updated:</span>
          <span id="load-time" class="font-medium text-gray-900"></span>
        </div>
        <div class="flex items-center bg-blue-50 px-3 py-1.5 rounded-full">
          <span id="timer" class="text-sm font-medium text-blue-600">Loading...</span>
        </div>
      </div>
    </div>
  </div>
</nav>

<script>
  let clientTimer
  
  document.addEventListener('DOMContentLoaded', function () {
    checkForUnfinishedTask()
    const loadTime = new Date()
    const loadTimeString = loadTime.toLocaleString('en-US', { hour: 'numeric', minute: 'numeric', hour12: true })
    document.getElementById('load-time').textContent = loadTimeString
  })
  
  function startTimer(startingTime) {
    clientTimer = setInterval(function () {
      startingTime++
      updateTimerDisplay(startingTime)
    }, 1000)
  }
  
  function stopTimer() {
    clearInterval(clientTimer)
  }
  
  function secondsSinceMidnight(timeString) {
    const [hours, minutes, seconds] = timeString.split(':').map(Number)
    return hours * 3600 + minutes * 60 + seconds
  }
  
  async function checkForUnfinishedTask() {
    const response = await fetch('/unfinished_tasks')
    const tasks = await response.json()
    if (tasks.length > 0) {
      const taskStartTime = secondsSinceMidnight(tasks[0].start_time)
      const now1 = new Date()
      const startOfDay = new Date(now1.getFullYear(), now1.getMonth(), now1.getDate())
      const currentSeconds1 = (now1 - startOfDay) / 1000
      const startingTime = currentSeconds1 - taskStartTime
      startTimer(startingTime)
    } else {
      updateTimerDisplay('No timer running')
    }
  }
  
  function updateTimerDisplay(seconds) {
    if (seconds === 'No timer running') {
      document.getElementById('timer').innerText = 'No timer running'
    } else {
      const hours = Math.floor(seconds / 3600)
      const minutes = Math.floor((seconds % 3600) / 60)
      const remainingSeconds = parseInt(seconds % 60)
      const formattedTime = `Task Running: ${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`
      document.getElementById('timer').innerText = formattedTime
    }
  }
</script>
