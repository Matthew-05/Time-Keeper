<header class="tk-titlebar" id="window-titlebar">
  <div class="tk-titlebar-brand pywebview-drag-region" aria-hidden="true">
    <img src="{{ url_for('static', filename='img/tenth-mark-color.svg') }}" alt="" />
    <span class="tk-titlebar-brand-name">TimeKeeper</span>
  </div>

  <div class="tk-window-controls" aria-label="Window controls">
    <button class="tk-window-control" type="button" data-window-action="minimize" aria-label="Minimize" title="Minimize" disabled>
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M1.5 6.5h9" />
      </svg>
    </button>
    <button class="tk-window-control" type="button" data-window-action="maximize" aria-label="Maximize" title="Maximize" disabled>
      <svg class="tk-window-maximize-icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1">
        <rect x="1.75" y="1.75" width="8.5" height="8.5" />
      </svg>
      <svg class="tk-window-restore-icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M3.25 3.25v-1.5h7v7h-1.5" />
        <rect x="1.75" y="3.25" width="7" height="7" />
      </svg>
    </button>
    <button class="tk-window-control tk-window-control-close" type="button" data-window-action="close" aria-label="Close" title="Close" disabled>
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1">
        <path d="m2 2 8 8M10 2 2 10" />
      </svg>
    </button>
  </div>
</header>

<div class="tk-resize-handle tk-resize-handle-n" data-resize-direction="n" aria-hidden="true"></div>
<div class="tk-resize-handle tk-resize-handle-ne" data-resize-direction="ne" aria-hidden="true"></div>
<div class="tk-resize-handle tk-resize-handle-e" data-resize-direction="e" aria-hidden="true"></div>
<div class="tk-resize-handle tk-resize-handle-se" data-resize-direction="se" aria-hidden="true"></div>
<div class="tk-resize-handle tk-resize-handle-s" data-resize-direction="s" aria-hidden="true"></div>
<div class="tk-resize-handle tk-resize-handle-sw" data-resize-direction="sw" aria-hidden="true"></div>
<div class="tk-resize-handle tk-resize-handle-w" data-resize-direction="w" aria-hidden="true"></div>
<div class="tk-resize-handle tk-resize-handle-nw" data-resize-direction="nw" aria-hidden="true"></div>
